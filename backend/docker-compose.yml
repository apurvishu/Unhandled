services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih26006-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg2://sih26006:changeme_in_production@postgres:5432/sih26006
      - ASYNC_DATABASE_URL=postgresql+asyncpg://sih26006:changeme_in_production@postgres:5432/sih26006
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sih26006-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih26006-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg2://sih26006:changeme_in_production@postgres:5432/sih26006
      - ASYNC_DATABASE_URL=postgresql+asyncpg://sih26006:changeme_in_production@postgres:5432/sih26006
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sih26006-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih26006-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sih26006-network

  postgres:
    image: postgis/postgis:16-3.4
    container_name: sih26006-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sih26006
      POSTGRES_PASSWORD: changeme_in_production
      POSTGRES_DB: sih26006
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih26006 -d sih26006"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sih26006-network

  redis:
    image: redis:7-alpine
    container_name: sih26006-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sih26006-network

volumes:
  postgres_data:
  redis_data:

networks:
  sih26006-network:
    driver: bridge
